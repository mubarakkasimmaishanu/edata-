    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts: preconnect + direct <link> so the browser fetches the
         font CSS in parallel with our main stylesheet (previously the fonts
         were pulled via `@import url(...)` inside index.css, which forced a
         serial waterfall: HTML → CSS → font CSS → font files). `display=swap`
         inside the URL keeps text non-blocking — the fallback system font
         renders immediately and swaps to Inter/JetBrains when ready. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" />
