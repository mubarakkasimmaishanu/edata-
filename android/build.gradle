// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                lintOptions {
                    checkReleaseBuilds false
                    abortOnError false
                }
            }
            def typedefFile = new File(project.buildDir, "intermediates/annotations_typedef_file/release/extractReleaseAnnotations/typedefs.txt")
            typedefFile.parentFile.mkdirs()
            if (!typedefFile.exists()) {
                typedefFile.text = ""
            }
        }
        project.tasks.matching {
            it.name.contains("extractReleaseAnnotations") ||
            it.name.contains("lintVital") ||
            it.name.contains("Lint")
        }.configureEach {
            enabled = false
        }
    }
}


task clean(type: Delete) {
    delete rootProject.buildDir
}
