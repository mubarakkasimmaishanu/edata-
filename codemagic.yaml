workflows:
  ios-release:
    name: eData iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: lts
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eDATA.app
      vars:
        BUNDLE_ID: "com.eDATA.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Node Dependencies
        script: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build Web Application
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Set up Apple Code Signing
        script: |
          # Apply the uploaded iOS Distribution certificate and Provisioning profile
          xcode-project use-profiles
      - name: Build iOS Application (.ipa / .xcarchive)
        script: |
          # Build officially signed App Store / TestFlight IPA
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - dev@edata.com.ng
        notify:
          success: true
          failure: true
