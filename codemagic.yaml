workflows:
  ios-release:
    name: eData iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: eData Key
    environment:
      node: lts
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eDATA.app
      vars:
        BUNDLE_ID: "com.eDATA.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Node Dependencies
        script: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build Web Application
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Inject GTMAppAuth Privacy Manifest
        script: |
          PRIVACY_SRC="$PWD/ios/App/App/PrivacyInfo.xcprivacy"
          
          # 1. Copy into Pods source folders
          find ios/App/Pods -type d -name "GTMAppAuth*" | while read -r dir; do
            echo "Copying PrivacyInfo to $dir"
            mkdir -p "$dir/Resources"
            cp -f "$PRIVACY_SRC" "$dir/Resources/PrivacyInfo.xcprivacy"
            cp -f "$PRIVACY_SRC" "$dir/PrivacyInfo.xcprivacy"
          done
          
          # 2. Patch Pods-App-frameworks.sh to guarantee PrivacyInfo.xcprivacy is inside GTMAppAuth.framework before codesigning
          FRAMEWORKS_SCRIPT="ios/App/Pods/Target Support Files/Pods-App/Pods-App-frameworks.sh"
          if [ -f "$FRAMEWORKS_SCRIPT" ]; then
            python3 -c "
p = '$FRAMEWORKS_SCRIPT'
with open(p, 'r') as f:
    c = f.read()

injection = '''
    if [ -d \"\$destination/GTMAppAuth.framework\" ]; then
      echo \"Injecting PrivacyInfo.xcprivacy into \$destination/GTMAppAuth.framework\"
      cp -f \"$PRIVACY_SRC\" \"\$destination/GTMAppAuth.framework/PrivacyInfo.xcprivacy\"
    fi
'''
if 'code_sign_if_enabled' in c:
    c = c.replace('code_sign_if_enabled', injection + '\n    code_sign_if_enabled', 1)
    with open(p, 'w') as f:
        f.write(c)
    print('Successfully patched Pods-App-frameworks.sh with GTMAppAuth privacy manifest!')
"
          fi
      - name: Set up Apple Code Signing
        script: |
          # Apply the uploaded iOS Distribution certificate and Provisioning profile
          xcode-project use-profiles
      - name: Build iOS Application (.ipa)
        script: |
          # Build officially signed App Store / TestFlight IPA
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
      - name: Verify IPA Privacy Manifest
        script: |
          for ipa in build/ios/ipa/*.ipa; do
            echo "Inspecting IPA: $ipa"
            unzip -l "$ipa" | grep -i "PrivacyInfo.xcprivacy"
          done
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - dev@edata.com.ng
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
