workflows:
  ios-release:
    name: eData iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: lts
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.eDATA.app
      vars:
        BUNDLE_ID: "com.eDATA.app"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Node Dependencies
        script: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      - name: Build Web Application
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Set up Apple Code Signing
        script: |
          # Apply the uploaded iOS Distribution certificate and Provisioning profile
          xcode-project use-profiles
      - name: Build iOS Application (.ipa / .xcarchive)
        script: |
          # Build officially signed App Store / TestFlight IPA
          if xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"; then
            echo "IPA generated successfully via xcode-project build-ipa!"
          else
            echo "Direct xcode-project failed, compiling via xcodebuild archive..."
            cd ios/App
            xcodebuild \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/App.xcarchive \
              archive
            
            mkdir -p build/Payload
            cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/App.app
            cd build
            zip -r eData-Release-signed.ipa Payload
            echo "Packaged eData-Release-signed.ipa successfully!"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - dev@edata.com.ng
        notify:
          success: true
          failure: true
